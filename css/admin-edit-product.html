<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Edit Product | Natural Collection</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="admin-wrapper">

<!-- Sidebar -->

<aside class="sidebar">

<div class="logo">

🌿 Natural Collection

</div>

<ul>

<li>

<a href="admin-dashboard.html">

<i class="fa-solid fa-gauge"></i>

Dashboard

</a>

</li>

<li class="active">

<a href="admin-products.html">

<i class="fa-solid fa-box"></i>

Products

</a>

</li>

<li>

<a href="admin-orders.html">

<i class="fa-solid fa-cart-shopping"></i>

Orders

</a>

</li>

<li>

<a href="admin-users.html">

<i class="fa-solid fa-users"></i>

Users

</a>

</li>

<li>

<a href="admin-settings.html">

<i class="fa-solid fa-gear"></i>

Settings

</a>

</li>

<li>

<a href="#"
onclick="adminLogout()">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</a>

</li>

</ul>

</aside>

<!-- Main -->

<main class="admin-main">

<header class="admin-header">

<h2>

✏ Edit Product

</h2>

</header>

<form id="editProductForm" class="admin-form">

<div class="form-group">

<label>Product Name</label>

<input
type="text"
id="productName"
required>

</div>

<div class="form-group">

<label>Price</label>

<input
type="number"
id="productPrice"
required>

</div>

<div class="form-group">

<label>Category</label>

<input
type="text"
id="productCategory"
required>

</div>

<div class="form-group">

<label>Stock</label>

<input
type="number"
id="productStock"
required>

</div>

<div class="form-group">

<label>Description</label>

<textarea
id="productDescription"
rows="5">

</textarea>

</div>

<div class="form-group">

<label>

Current Image

</label>

<br>

<img

id="previewImage"

src="images/default-product.png"

width="150"

style="border-radius:10px;">

</div>

<div class="form-group">

<label>

New Image

</label>

<input

type="file"

id="productImage"

accept="image/*">

</div>

<div class="form-group">

<label>

<input

type="checkbox"

id="productFeatured">

Featured Product

</label>

</div>

<button

type="submit"

class="btn">

💾 Update Product

</button>

<a

href="admin-products.html"

class="btn">

⬅ Back

</a>

</form>
<!-- ==========================================
Footer
========================================== -->

<footer class="admin-footer">

<p>

© 2026 Natural Collection Admin Panel | All Rights Reserved

</p>

</footer>

</main>

</div>

<!-- ==========================================
Scripts
========================================== -->

<script type="module" src="js/admin-auth.js"></script>

<script type="module" src="js/admin-edit-product.js"></script>

<script src="js/app.js"></script>

</body>

</html>
