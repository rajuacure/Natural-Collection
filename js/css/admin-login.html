<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Login | Natural Collection</title>

<link rel="stylesheet"
href="css/style.css">

<link rel="stylesheet"
href="css/admin.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<section class="admin-login">

<div class="admin-card">

<div class="admin-logo">

🌿

</div>

<h2>

Natural Collection

</h2>

<p>

Admin Control Panel

</p>

<form id="adminLoginForm">

<div class="input-group">

<label>

Admin Email

</label>

<input

type="email"

id="adminEmail"

placeholder="admin@email.com"

required>

</div>

<div class="input-group">

<label>

Password

</label>

<input

type="password"

id="adminPassword"

placeholder="Password"

required>

</div>

<div class="remember-box">

<label>

<input

type="checkbox"

id="rememberAdmin">

Remember Me

</label>

</div>

<button

type="submit"

class="btn">

<i class="fa-solid fa-right-to-bracket"></i>

Login

</button>
